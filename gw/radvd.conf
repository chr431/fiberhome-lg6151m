# radvd.conf v1.0 -- SLAAC + RDNSS for br-lan (deploy: /data/gw/radvd.conf)
# ULA fd42:9ac1:7e50::/64 = rc_netfh v1.4 NAT66 source prefix.
# RDNSS = dnsmasq's v6 socket (:::53) on the same ULA. radvd binary is FH's
# /fhrom/bin/radvd (1.6) -- needs LD_LIBRARY_PATH=/fhrom/lib (rc_netfh exports).
interface br-lan
{
    AdvSendAdvert on;
    MaxRtrAdvInterval 60;
    MinRtrAdvInterval 20;
    prefix fd42:9ac1:7e50::/64
    {
        AdvOnLink on;
        AdvAutonomous on;
    };
    RDNSS fd42:9ac1:7e50::1
    {
        AdvRDNSSLifetime 120;
    };
};
