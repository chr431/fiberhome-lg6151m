# slotguard.conf v1.0 -- hot family-record slot whitelist.
#
# comm|offset_below_start_stack|mode|max_writes_per_hour|scan_window
#
#   comm       exact /proc/<pid>/stat comm token (never a substring)
#   offset     bytes below start_stack; hex accepted; must be 8-byte aligned
#   mode       observe  -> count/log only (WOULD_SANITIZE)
#              sanitize -> write when ALL danger gates pass (see design doc §4)
#   max_writes per-slot hourly write budget (bounds the fighting rate)
#   scan_window self-learning window below start_stack (0 = off)
#
# Ship state: EVERY slot is observe.  Arming needs a second key:
#   /data/gw/slotguard.arm  (present = writes allowed at all)
# and a config edit that sets mode=sanitize for the specific slot.  Promoting a
# CANDIDATE line from the log is exactly that edit.
#
# Slots and their measured evidence (sampler2.log, 2026-11-01):
#   dnsmasq 0x1b40  3197 samples, content constant  (stale record)
#   nerepair 0x3b0  3065 samples, many distinct q0  (hot, ~0.62 writes/s)
#   nerepair 0x12d0 3197 samples
dnsmasq|0x1b40|observe|120|0x8000
nerepair|0x3b0|observe|120|0x8000
nerepair|0x12d0|observe|120|0
