# defaults.conf -- 出厂默认设置(只读基线; 部署为 444)
# 配置体系统一(2026-10-05): 本文件=只读默认, settings.conf=用户可变稀疏覆盖。
# 消费方以 POSIX source 叠载: . defaults.conf; . settings.conf (后写覆盖, 零库依赖)。
# 写入方(api.sh gw_set)只更新 settings.conf, 本文件永不改动。
# 键空间: WIFI 族沿用 wifi_up 既有名(SSID_BASE/WPAPSK/AUTH/CH2G/.../INONE);
#         LED_NIGHT / FAN_MODE / DHCP_R1 / DHCP_R2 / DHCP_LEASE 防通用名撞车。
# D2 开箱审查(2026-10-06): SSID 不再携带开发者真实网络名; WPAPSK 必须非空
# (曾为空 = 首刷开放网络)。首刷默认 WiFi 口令 = lg6151m0 — 8位(WPA下限; 全量回归
# 实弹: 旧值 lg6151m 仅7位被 wpapmk 拒绝, hostapd 拒启, 首刷无WiFi!)。GUI 管理口令
# 默认仍为 lg6151m(登录无WPA长度约束), 登录后请一并修改。用户实际值写 settings.conf 覆盖。
SSID_BASE=LG6151M
AUTH=WPA2PSK
WPAPSK=lg6151m0
CH2G=0
CH5G=0
BW2G=20
BW5G=80
POWER=100
HIDDEN=0
GUEST=1
INONE=0
LED_NIGHT=0
FAN_MODE=performance
DHCP_R1=192.168.9.100
DHCP_R2=192.168.9.200
DHCP_LEASE=12h
